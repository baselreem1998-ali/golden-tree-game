<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tree of Chronos</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
:root{--gold:#d4a437;--gold2:#ffd700;--emerald:#3ddc97;}
body{min-height:100vh;font-family:'Cairo',sans-serif;color:#f2f2f2;overflow-x:hidden;
  background:#170a33 url('images/bg.jpg') center top/cover no-repeat;}
#splashScreen{position:fixed;inset:0;z-index:999;background:#170a33 url('images/splash.jpg') center/cover no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14%;}
.game-title{font-family:'Amiri',serif;font-size:34px;color:var(--gold2);margin-bottom:22px;text-shadow:0 0 12px rgba(255,215,0,.6),0 3px 6px #000;}
.loading-bar-wrap{width:78%;max-width:320px;height:16px;background:rgba(0,0,0,.5);border-radius:20px;overflow:hidden;border:2px solid var(--gold2);}
#loadingBar{height:100%;width:0;background:linear-gradient(90deg,#3ddc97,#ffd700);transition:width .12s linear;}
#loadingPct{margin-top:10px;color:var(--gold2);font-weight:700;text-shadow:0 2px 4px #000;}
#gameScreen{display:none;position:fixed;inset:0;overflow:hidden;}
#stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transform-origin:center center;}
.container{width:380px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));}
.bottom{margin-top:12px;}
.balance{font-weight:700;color:var(--gold2);}
#freeSpinsBadge{display:none;text-align:center;color:var(--emerald);font-weight:700;margin-bottom:6px;}
.logo{text-align:center;font-family:'Amiri',serif;font-size:32px;color:#ffd700;margin:4px 0 8px;
  text-shadow:0 0 14px rgba(255,215,0,.7),0 3px 0 #8a5a00;user-select:none;cursor:default;}
.reels{position:relative;direction:ltr;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:start;}
.reel{position:relative;display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:8px;min-width:0;background:linear-gradient(180deg,#1a1450,#0f0a35);border:2px solid #b8862b;box-shadow:0 0 8px rgba(184,134,43,.35);}
.cell{width:100%;aspect-ratio:1/1;min-height:0;overflow:hidden;position:relative;border-radius:6px;font-size:30px;display:flex;align-items:center;justify-content:center;}
.cell img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;}
.cell img.sym-blank{inset:-34%;width:168%;height:168%;}
.cell.win{background:rgba(61,220,151,.18);z-index:2;animation:winCelebrate 1s ease-in-out infinite;box-shadow:0 0 14px var(--gold2);}
@keyframes winCelebrate{
  0%{transform:scale(1);}
  30%{transform:scale(1.32);}
  55%{transform:scale(1.08);}
  75%{transform:scale(1.2);}
  100%{transform:scale(1.08);}
}
.cell.win.wild-win{box-shadow:0 0 22px var(--gold2), 0 0 40px rgba(255,215,0,.6);}
.cell.win.wild-win img{filter:drop-shadow(0 0 8px rgba(255,215,0,.9));}
.badge{position:absolute;bottom:0;right:0;background:var(--gold2);color:#111;font-size:10px;font-weight:800;padding:0 4px;border-radius:6px;z-index:3;}
.expand-wild{
  position:absolute;inset:0;z-index:10;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-radius:8px;
  background:linear-gradient(180deg,#1a1450,#0f0a35);
  transform-origin:center;
  animation:expandWildBurst .6s cubic-bezier(.2,.9,.3,1.3) forwards;
}
.expand-wild img{width:100%;height:100%;object-fit:cover;object-position:center;filter:drop-shadow(0 0 14px rgba(255,215,0,.95));position:relative;z-index:2;}
@keyframes expandWildBurst{
  0%{ transform:scaleY(.28) rotate(-2deg); opacity:.55; filter:brightness(1.9); }
  40%{ transform:scaleY(1.14) rotate(1.5deg); opacity:1; filter:brightness(2.1); }
  65%{ transform:scaleY(.94) rotate(-.8deg); filter:brightness(1.3); }
  100%{ transform:scaleY(1) rotate(0); filter:brightness(1); }
}
.wild-glow{
  position:absolute; inset:-25%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,215,0,.65) 0%, rgba(255,215,0,.15) 45%, transparent 72%);
  z-index:9;
  pointer-events:none;
  animation:wildGlowPulse .75s ease-out forwards;
}
@keyframes wildGlowPulse{
  0%{ opacity:0; transform:scale(.35); }
  45%{ opacity:1; transform:scale(1.25); }
  100%{ opacity:0; transform:scale(1.7); }
}
.spark{
  position:absolute; width:6px; height:6px; border-radius:50%;
  background:radial-gradient(circle, #fff, var(--gold2) 55%, transparent 100%);
  pointer-events:none; z-index:12;
  box-shadow:0 0 6px 2px rgba(255,215,0,.85);
  animation:sparkFly .8s ease-out forwards;
}
@keyframes sparkFly{
  0%{ transform:translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(var(--sx), var(--sy)) scale(0); opacity:0; }
}
.reel.spinning{ overflow:hidden; }
.reel.spinning .cell img{
  filter:blur(1.3px) brightness(1.04);
  transform:scaleY(1.08);
  transition:filter .06s linear, transform .06s linear;
}
.reel.spinning .cell{ opacity:.92; }
.cell.dropping img{ animation:cellDrop .22s cubic-bezier(.3,.9,.4,1); }
@keyframes cellDrop{
  0%{ transform:translateY(-30%) scaleY(1.15); opacity:.5; }
  70%{ transform:translateY(4%) scaleY(1.02); opacity:1; }
  100%{ transform:translateY(0) scaleY(1); opacity:1; }
}
.reels.shake{ animation:reelShake .35s ease-in-out; }
@keyframes reelShake{
  0%,100%{ transform:translate(0,0); }
  20%{ transform:translate(-6px,-3px); }
  40%{ transform:translate(5px,3px); }
  60%{ transform:translate(-4px,-2px); }
  80%{ transform:translate(3px,1px); }
}
#goldFlash{
  position:fixed; inset:0; z-index:120; pointer-events:none; opacity:0;
  background:radial-gradient(circle, rgba(255,215,0,.32), transparent 65%);
}
#goldFlash.on{ animation:goldFlashAnim .5s ease-out forwards; }
@keyframes goldFlashAnim{
  0%{ opacity:0; } 30%{ opacity:1; } 100%{ opacity:0; }
}
#lineOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.win-line{
  stroke:var(--gold2);
  stroke-width:2.4;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 3px rgba(255,215,0,.95)) drop-shadow(0 0 6px rgba(255,215,0,.6));
  opacity:0;
  animation:lineFadeIn .3s ease-out forwards;
  vector-effect:non-scaling-stroke;
}
@keyframes lineFadeIn{ to{ opacity:1; } }
.suits{direction:ltr;display:flex;gap:5px;margin-bottom:10px;}
.suit{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:18px;
  background:rgba(10,4,30,.55);border:1.5px solid #8a6a2a;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;}
.suit b{font-size:16px;line-height:1;} .suit .k{color:#e8e0ff;} .suit .r{color:#ff3b4f;}
.balbar{margin-top:10px;padding:10px;border-radius:14px;text-align:center;background:rgba(10,4,30,.6);border:1.5px solid rgba(212,164,55,.45);font-weight:700;}
.balbar b{color:var(--gold2);font-size:19px;margin:0 6px;}
.balbar small{color:#ccc;font-weight:400;}
.chips{direction:ltr;display:flex;gap:6px;justify-content:center;margin:12px 0 10px;}
.chip{flex:1;padding:9px 0;border-radius:22px;border:1.5px solid #6b5a8f;background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
.chip.active{border-color:var(--gold2);box-shadow:0 0 8px rgba(255,215,0,.5);}
.actions{direction:ltr;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:90px;}
.buy{width:60px;height:60px;padding:4px;border-radius:14px;border:2px solid var(--gold2);cursor:pointer;
  background:linear-gradient(180deg,#7a3ff0,#4b1fa8);color:var(--gold2);font-weight:800;font-family:'Cairo',sans-serif;line-height:1.15;font-size:11px;flex:none;}
.buy small{display:block;font-size:11px;color:#fff;}
.spin-wrap{position:relative;display:inline-flex;flex:none;}
.spin{width:78px;height:78px;padding:0;overflow:hidden;border-radius:50%;border:4px solid #cfcfe8;cursor:pointer;background:#0d0820;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(160,140,255,.5);}
.spin img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.spin.spinning img{animation:rot .5s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.rbtn{position:relative;width:42px;height:42px;border-radius:50%;border:2px solid #cfcfe8;background:rgba(20,10,50,.7);color:#fff;font-size:14px;cursor:pointer;flex:none;}
.rbtn.on{border-color:var(--gold2);color:var(--gold2);}
.cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;
  background:var(--gold2);color:#111;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:5;}
.cnt.emerald{background:var(--emerald);}
.levels{direction:ltr;display:none;gap:8px;justify-content:center;margin-bottom:10px;}
.lv{width:40px;height:40px;border-radius:50%;border:1.5px solid #6b5a8f;background:rgba(255,255,255,.1);color:#fff;font-weight:700;cursor:pointer;}
.lv.active{border-color:var(--gold2);}
#result{min-height:48px;margin:8px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
button:disabled{opacity:.5;cursor:not-allowed;}
.result{margin-top:16px;min-height:26px;text-align:center;font-weight:700;font-size:16px;}
.win-t{color:#00ff88;} .lose-t{color:#ff6b6b;}
.stats,.pay{margin-top:14px;padding:12px;background:rgba(0,0,0,.35);border-radius:10px;font-size:13px;}
.pay summary{cursor:pointer;font-weight:700;color:var(--gold2);}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;}
.prow .ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
.prow img{width:26px;height:26px;object-fit:contain;}
.prow .v{color:#ccc;font-size:12px;}
.auto-menu{
  display:none;position:absolute;bottom:52px;left:calc(50% - 116px);
  flex-direction:column;gap:6px;background:rgba(10,4,30,.92);
  border:1.5px solid rgba(212,164,55,.6);border-radius:14px;padding:8px;z-index:20;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.auto-menu button{
  width:56px;padding:9px 0;border-radius:10px;border:1.5px solid #6b5a8f;
  background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:14px;cursor:pointer;
}
.auto-menu button:hover,.auto-menu button:active{border-color:var(--gold2);background:rgba(255,215,0,.12);}
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px;
}
.modal-card{
  width:100%;max-width:340px;background:linear-gradient(180deg,#1c1050,#100a30);
  border:2px solid var(--gold2);border-radius:18px;padding:16px;
  box-shadow:0 0 30px rgba(255,215,0,.25);
}
.modal-title{text-align:center;font-family:'Amiri',serif;font-size:20px;color:var(--gold2);margin-bottom:2px;
  text-shadow:0 0 10px rgba(255,215,0,.5);}
.modal-title span{display:block;font-size:14px;color:#c9a5ff;margin-top:2px;}
.bet-stepper{direction:ltr;display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 4px;}
.bet-stepper button{
  width:38px;height:38px;border-radius:10px;border:1.5px solid var(--gold2);
  background:rgba(255,215,0,.12);color:var(--gold2);font-size:20px;font-weight:800;cursor:pointer;
}
.bet-stepper button:disabled{opacity:.4;cursor:not-allowed;}
.bet-disp{
  min-width:120px;text-align:center;padding:9px 14px;border-radius:12px;
  background:rgba(255,255,255,.08);border:1.5px solid #6b5a8f;font-weight:800;color:var(--gold2);font-size:15px;
}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px;}
.pkg{
  border:1.5px solid #6b5a8f;border-radius:12px;padding:8px;text-align:center;cursor:pointer;
  background:rgba(255,255,255,.04);
}
.pkg.sel{border-color:var(--gold2);box-shadow:0 0 12px rgba(255,215,0,.4);background:rgba(255,215,0,.08);}
.pkg-icons{display:flex;align-items:center;justify-content:center;gap:2px;height:54px;margin-bottom:4px;}
.pkg-icons img{height:44px;object-fit:contain;}
.pkg-icons.double img{height:38px;}
.pkg-icons.triple img{height:32px;}
.pkg-icons.quad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;height:54px;}
.pkg-icons.quad img{height:22px;width:100%;object-fit:contain;}
.pkg-icons.quad span{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold2);font-size:16px;
  background:rgba(255,255,255,.06);border-radius:4px;}
.pkg-cost{font-weight:800;color:var(--gold2);font-size:14px;}
.pkg-sub{font-size:11px;color:#c9c3e8;margin-top:2px;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-actions button{flex:1;padding:11px 0;border-radius:12px;border:none;font-weight:800;cursor:pointer;font-size:14px;}
.modal-actions .cancel{background:rgba(255,255,255,.1);color:#fff;}
.modal-actions .confirm{background:linear-gradient(180deg,#7ee89a,#2e9e57);color:#062;}
.modal-actions .confirm:disabled{opacity:.5;cursor:not-allowed;}
.fs-intro{display:none;position:fixed;inset:0;z-index:150;align-items:center;justify-content:center;background:rgba(0,0,0,.55);}
.fs-intro-text{font-family:'Amiri',serif;font-size:24px;color:var(--gold2);background:rgba(20,10,50,.92);
  border:2px solid var(--gold2);border-radius:20px;padding:22px 30px;text-align:center;
  box-shadow:0 0 30px rgba(255,215,0,.4);line-height:1.6;}
.fs-intro-text b{font-size:34px;display:block;margin-top:4px;}
.win-overlay{
  display:none;position:fixed;inset:0;z-index:180;align-items:center;justify-content:center;
  flex-direction:column;pointer-events:none;
  background:radial-gradient(circle, rgba(40,10,70,.5), rgba(0,0,0,.72));
}
.win-overlay.show{display:flex;animation:winOverlayIn .35s ease-out;}
@keyframes winOverlayIn{ 0%{opacity:0;transform:scale(.7);} 100%{opacity:1;transform:scale(1);} }
.win-overlay-title{
  font-family:'Amiri',serif;font-size:38px;font-weight:800;color:var(--gold2);letter-spacing:2px;
  text-shadow:0 0 22px rgba(255,215,0,.85),0 3px 6px #000;
}
.win-overlay-amount{
  margin-top:12px;font-size:46px;font-weight:800;color:#fff;
  text-shadow:0 0 16px rgba(255,215,0,.7),0 2px 4px #000;
}
.shock-ring{
  position:fixed; top:50%; left:50%; width:10px; height:10px;
  border-radius:50%; border:3px solid rgba(255,215,0,.9);
  transform:translate(-50%,-50%); pointer-events:none; z-index:170;
  animation:shockRingBurst 1s cubic-bezier(.15,.8,.3,1) forwards;
}
@keyframes shockRingBurst{
  0%{ width:10px; height:10px; opacity:1; border-width:4px; }
  100%{ width:900px; height:900px; opacity:0; border-width:0px; }
}
.sound-toggle{
  position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(212,164,55,.6);background:rgba(10,4,30,.6);color:#fff;
  font-size:15px;cursor:pointer;z-index:15;
}
.sound-toggle.off{opacity:.5;}
</style>
</head>
<body>

<div id="splashScreen">
  <div class="game-title">Tree of Chronos</div>
  <div class="loading-bar-wrap"><div id="loadingBar"></div></div>
  <div id="loadingPct">0%</div>
</div>

<div id="gameScreen">
  <div id="stage">
  <div class="container">
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>
    <div id="freeSpinsBadge"></div>
    <div class="suits">
      <div class="suit"><b class="k">♣</b><span>2,087,245</span></div>
      <div class="suit"><b class="r">♦</b><span>3,736,579</span></div>
      <div class="suit"><b class="r">♥</b><span>40,275,162</span></div>
      <div class="suit"><b class="k">♠</b><span>4,303,948,751</span></div>
    </div>
    <div class="logo" id="logoTitle">TREE OF CHRONOS</div>

    <div class="reels" id="reels"></div>

    <div class="result" id="result"></div>

    <div class="bottom">

    <div class="chips" id="chips"></div>
    <div class="levels" id="levels"></div>
    <div class="actions">
      <div class="auto-menu" id="autoMenu">
        <button onclick="chooseAuto(10)">10</button>
        <button onclick="chooseAuto(20)">20</button>
        <button onclick="chooseAuto(50)">50</button>
        <button onclick="chooseAuto(100)">100</button>
        <button onclick="chooseAuto('inf')">∞</button>
      </div>
      <button class="buy" id="buyBtn" onclick="openBuyModal()">BUY<small>BONUS</small></button>
      <button class="rbtn" id="autoBtn" onclick="startAuto()">▶<span class="cnt" id="autoCnt" style="display:none"></span></button>
      <div class="spin-wrap">
        <span class="cnt emerald" id="freeCnt" style="display:none;"></span>
        <button class="spin" id="spinBtn" onclick="spin()"><img src="images/spin-icon.jpg" alt="" onerror="this.replaceWith(document.createTextNode('🔄'))"></button>
      </div>
      <button class="rbtn" id="speedBtn" onclick="cycleSpeed()">⚡</button>
      <button class="rbtn" id="coinBtn" onclick="toggleLevels()">🪙</button>
    </div>

    <div class="balbar">NSP <b id="balance">...</b></div>
    </div>
  </div>
  </div>
</div>

<div class="fs-intro" id="fsIntro">
  <div class="fs-intro-text">لديك<b id="fsIntroCount">5</b>لفات مجانية</div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-overlay-title" id="winOverlayTitle">BIG WIN</div>
  <div class="win-overlay-amount" id="winOverlayAmount">0</div>
</div>

<div class="modal-overlay" id="buyModal">
  <div class="modal-card">
    <div class="modal-title">BUY BONUS<span>الحد الأقصى ×20,000</span></div>

    <div class="bet-stepper">
      <button onclick="bonusStepBet(1)">+</button>
      <div class="bet-disp" id="bonusBetDisplay">300 NSP</div>
      <button onclick="bonusStepBet(-1)">−</button>
    </div>

    <div class="pkg-grid">
      <div class="pkg" onclick="selectPkg(this,'1')">
        <div class="pkg-icons single"><img src="images/wild-base.png" alt=""></div>
        <div class="pkg-cost" id="pkgCost1">-</div>
        <div class="pkg-sub">Wild واحد مضمون</div>
      </div>
      <div class="pkg" onclick="selectPkg(this,'2')">
        <div class="pkg-icons double"><img src="images/wild-base.png" alt=""><img src="images/wild-base.png" alt=""></div>
        <div class="pkg-cost" id="pkgCost2">-</div>
        <div class="pkg-sub">Wild اثنان مضمونان</div>
      </div>
      <div class="pkg" onclick="selectPkg(this,'3')">
        <div class="pkg-icons triple"><img src="images/wild-base.png" alt=""><img src="images/wild-base.png" alt=""><img src="images/wild-base.png" alt=""></div>
        <div class="pkg-cost" id="pkgCost3">-</div>
        <div class="pkg-sub">3 Wild مضمونة</div>
      </div>
      <div class="pkg" onclick="selectPkg(this,'r')">
        <div class="pkg-icons quad"><img src="images/wild-base.png" alt=""><span>؟</span><span>؟</span><span>؟</span></div>
        <div class="pkg-cost" id="pkgCostR">-</div>
        <div class="pkg-sub">عشوائي (1-4 Wild)</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeBuyModal()">إلغاء</button>
      <button class="confirm" id="confirmBuyBtn" onclick="confirmBuy()" disabled>شراء</button>
    </div>
  </div>
</div>

<audio id="bgMusic" src="images/bg-music.mp3" loop preload="auto" style="display:none"></audio>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
window.__dataReady=false;
(function(){
  var p=0, t0=Date.now(), bar=document.getElementById('loadingBar'), pct=document.getElementById('loadingPct');
  function done(){
    document.getElementById('splashScreen').style.display='none';
    document.getElementById('gameScreen').style.display='block';
    if(window.__fitStage) window.__fitStage();
  }
  window.addEventListener('error',function(e){ pct.textContent='خطأ: '+e.message; console.error(e); });
  var iv=setInterval(function(){
    p+=Math.random()*15+5;
    var late=Date.now()-t0>20000;
    if(!window.__dataReady && !late) p=Math.min(p,90);
    if(p>=100){ p=100; clearInterval(iv); setTimeout(done,300); }
    bar.style.width=p+'%'; pct.textContent=Math.floor(p)+'%';
  },130);
})();
</script>
<script type="module">
let dbApi = null;

function R(n){ return Math.round(n); }

const SoundEngine = (() => {
  let ctx = null;
  function ac(){
    if(!ctx){
      try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ ctx=null; }
    }
    if(ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(freq, dur, type='sine', vol=0.25, startDelay=0, freqEnd=null){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime + startDelay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0+dur);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noiseBurst(dur, vol=0.2, startDelay=0, filterFreq=2500){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime + startDelay;
    const bufferSize = Math.max(1, Math.floor(c.sampleRate * dur));
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const src = c.createBufferSource();
    src.buffer = buffer;
    const filt = c.createBiquadFilter();
    filt.type='lowpass'; filt.frequency.value = filterFreq;
    const gain = c.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(filt); filt.connect(gain); gain.connect(c.destination);
    src.start(t0);
  }

  const bgMusicEl = document.getElementById('bgMusic');
  let musicBroken = false;
  if(bgMusicEl){
    bgMusicEl.volume = 0.15;
    bgMusicEl.addEventListener('error', ()=>{ musicBroken = true; console.warn('bg-music.mp3 فشل تحميلها، رح نستخدم الموسيقى المولّدة بدلها'); startAmbientSynth(); });
  }
  let ambientOn = false;
  let ambientNodes = null;
  function startAmbientSynth(){
    const c = ac(); if(!c || ambientNodes) return;
    ambientOn = true;
    const master = c.createGain();
    master.gain.setValueAtTime(0, c.currentTime);
    master.gain.linearRampToValueAtTime(0.018, c.currentTime + 2);
    master.connect(c.destination);
    const freqs = [130.81, 196.0, 246.94];
    const oscs = freqs.map(f=>{
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = c.createGain();
      g.gain.value = 0.5;
      osc.connect(g); g.connect(master);
      osc.start();
      return osc;
    });
    const lfo = c.createOscillator();
    lfo.frequency.value = 0.06;
    const lfoGain = c.createGain();
    lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain); lfoGain.connect(master.gain);
    lfo.start();
    ambientNodes = { master, oscs, lfo };
  }
  function stopAmbientSynth(){
    if(!ambientNodes) return;
    const c = ac();
    const t = c ? c.currentTime : 0;
    ambientNodes.master.gain.linearRampToValueAtTime(0, t+0.6);
    setTimeout(()=>{
      try{ ambientNodes.oscs.forEach(o=>o.stop()); ambientNodes.lfo.stop(); }catch(e){}
      ambientNodes = null;
    }, 700);
    ambientOn = false;
  }
  function startAmbient(){
    if(musicBroken){ startAmbientSynth(); return; }
    if(!bgMusicEl) { startAmbientSynth(); return; }
    bgMusicEl.play().then(()=>{ ambientOn = true; }).catch(()=>{ startAmbientSynth(); });
  }
  function stopAmbient(){
    if(bgMusicEl && !musicBroken) bgMusicEl.pause();
    if(ambientNodes) stopAmbientSynth();
    ambientOn = false;
  }
  return {
    unlock(){ ac(); startAmbient(); },
    toggleAmbient(){ if(ambientOn) stopAmbient(); else startAmbient(); return ambientOn; },
    click(){ noiseBurst(0.05,0.18,0,4000); tone(900,0.04,'square',0.05); },
    reelTick(){ tone(500 + Math.random()*150, 0.035, 'square', 0.05); },
    reelStop(){ noiseBurst(0.06,0.15,0,1800); tone(180,0.08,'sine',0.15); },
    wildDrop(){
      tone(90,0.25,'sine',0.3);
      [660,880,1320].forEach((f,i)=> tone(f,0.35,'triangle',0.12,0.04+i*0.05));
      [1568,1976,2349].forEach((f,i)=> tone(f,0.5,'sine',0.22,0.02+i*0.03));
    },
    win(){ [523,659,784].forEach((f,i)=> tone(f,0.22,'triangle',0.18,i*0.09)); },
    niceWin(){ [587,740,880,987].forEach((f,i)=> tone(f,0.25,'triangle',0.19,i*0.08)); },
    bigWin(){
      [523,659,784,1047].forEach((f,i)=> tone(f,0.3,'triangle',0.2,i*0.11));
      noiseBurst(0.3,0.08,0.3,6000);
    },
    megaWin(){
      [392,523,659,784,988,1175,1568].forEach((f,i)=> tone(f,0.4,'triangle',0.22,i*0.09));
      noiseBurst(0.5,0.12,0.5,7000);
      tone(1568,0.6,'sawtooth',0.06,0.55);
    },
    freeSpins(){ [660,880,1100,1320].forEach((f,i)=> tone(f,0.25,'triangle',0.16,i*0.08)); }
  };
})();

const pick = l => { let r=Math.random()*l.reduce((s,x)=>s+x.weight,0); for(const i of l){ r-=i.weight; if(r<=0) return i; } return l[l.length-1]; };

const SYMS_NO_BLANK = SYMS.filter(s => s.key !== 'blank');
const SYMS_NO_WILD = SYMS.filter(s => s.key !== 'wild');
const SYMS_NO_BLANK_NO_WILD = SYMS.filter(s => s.key !== 'blank' && s.key !== 'wild');
let lastBlankReels = new Set();
let spinsSinceWild = 0;
const WILD_PITY_SPINS = 20;
function poolForReel(r, avoidBlank, allowWild){
  if(r===1 || r===3) return allowWild ? SYMS_NO_BLANK : SYMS_NO_BLANK_NO_WILD;
  if(avoidBlank) return allowWild ? SYMS_NO_BLANK : SYMS_NO_BLANK_NO_WILD;
  return allowWild ? SYMS : SYMS_NO_WILD;
}

function randomCell(pool){
  const key = pick(pool).key, c={key};
  if(key==='wild') c.mult = pick(WMULTS).val;
  return c;
}
function randomColumn(pool){ return Array.from({length:ROWS}, ()=>randomCell(pool)); }

function makeGrid(){
  const bonusForce = guaranteedWildsPerSpin > 0;
  const pityReached = spinsSinceWild >= WILD_PITY_SPINS;
  const allowWild = bonusForce || inFree || pityReached;
  const usedBlankRows = new Set();
  const grid = [];
  for(let r=0;r<REELS;r++){
    const eligible = (r===0 || r===2 || r===4);
    const pool = poolForReel(r, lastBlankReels.has(r), allowWild);
    const col = Array.from({length:ROWS}, (_, row) => {
      let c = randomCell(pool);
      if(eligible && c.key==='blank' && usedBlankRows.has(row)){
        c = randomCell(allowWild ? SYMS_NO_BLANK : SYMS_NO_BLANK_NO_WILD);
      }
      if(eligible && c.key==='blank') usedBlankRows.add(row);
      return c;
    });
    grid.push(col);
  }
  if(guaranteedWildsPerSpin>0){
    const positions=[];
    for(let r=0;r<REELS;r++) for(let row=0;row<ROWS;row++) positions.push([r,row]);
    positions.sort(()=>Math.random()-0.5);
    for(let i=0;i<Math.min(guaranteedWildsPerSpin,positions.length);i++){
      const [r,row]=positions[i];
      grid[r][row] = { key:'wild', mult: pick(WMULTS).val };
    }
  }
  if(!bonusForce && !inFree){
    let hasWild = grid.some(col=>col.some(c=>c.key==='wild'));
    if(pityReached && !hasWild){
      const fr = [0,2,4][Math.floor(Math.random()*3)];
      const frow = Math.floor(Math.random()*ROWS);
      grid[fr][frow] = { key:'wild', mult: pick(WMULTS).val };
      hasWild = true;
    }
    spinsSinceWild = hasWild ? 0 : spinsSinceWild + 1;
  }
  const newBlankReels = new Set();
  [0,2,4].forEach(r=>{ if(grid[r].some(c=>c.key==='blank')) newBlankReels.add(r); });
  lastBlankReels = newBlankReels;
  return grid;
}
function imgOf(c){
  if(c.key==='wild') return WILD_IMG[c.mult];
  return SYMS.find(s=>s.key===c.key).img;
}
function emojiOf(c){
  if(c.key==='wild') return '🌳';
  return SYMS.find(s=>s.key===c.key).e;
}

function cellHTML(c, isWin){
  const badge = c.key==='wild' && c.mult===10 ? '<span class="badge">x10</span>' : '';
  const wildClass = (isWin && c.key==='wild') ? ' wild-win' : '';
  return `<div class="cell dropping ${isWin?'win'+wildClass:''}"><img class="sym-${c.key}" src="${imgOf(c)}" alt="" onerror="this.replaceWith(document.createTextNode('${emojiOf(c)}'))">${badge}</div>`;
}
function renderReelColumn(r, cells, winRowsForReel){
  const el = document.getElementById('reelCol'+r);
  if(!el) return;
  el.innerHTML = cells.map((c,row)=> cellHTML(c, winRowsForReel.includes(row))).join('');
}
function render(grid, wins=[]){
  let html='';
  for(let r=0;r<REELS;r++) html += `<div class="reel" id="reelCol${r}"></div>`;
  $('reels').innerHTML = html;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id = 'lineOverlay';
  svg.setAttribute('viewBox','0 0 100 100');
  svg.setAttribute('preserveAspectRatio','none');
  $('reels').appendChild(svg);
  for(let r=0;r<REELS;r++){
    const winRows = wins.filter(([wr])=>wr===r).map(([,wrow])=>wrow);
    renderReelColumn(r, grid[r], winRows);
  }
}

function cellCenterPct(r,row){ return { x:(r+0.5)/REELS*100, y:(row+0.5)/ROWS*100 }; }
function drawWinLines(winLinesCells){
  const svg = document.getElementById('lineOverlay');
  if(!svg) return;
  svg.innerHTML = '';
  winLinesCells.forEach(cells=>{
    if(cells.length<2) return;
    const pts = cells.map(([r,row])=>{ const p=cellCenterPct(r,row); return `${p.x},${p.y}`; }).join(' ');
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('points', pts);
    poly.setAttribute('class','win-line');
    svg.appendChild(poly);
  });
}
function clearWinLines(){
  const svg = document.getElementById('lineOverlay');
  if(svg) svg.innerHTML='';
}

function spawnSparks(container, count){
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    s.className = 'spark';
    const angle = Math.random()*Math.PI*2;
    const dist = 35 + Math.random()*45;
    s.style.setProperty('--sx', Math.cos(angle)*dist+'px');
    s.style.setProperty('--sy', Math.sin(angle)*dist+'px');
    s.style.left = (38 + Math.random()*24)+'%';
    s.style.top = (30 + Math.random()*40)+'%';
    container.appendChild(s);
    setTimeout(()=> s.remove(), 850);
  }
}

function evaluate(grid, b){
  let total=0; const wins=[]; const winLinesCells=[];
  LINES.forEach(line=>{
    const seq = line.map((row,r)=>grid[r][row]);
    let target=null, count=0; const cells=[];
    for(let i=0;i<seq.length;i++){
      const s = seq[i];
      if(s.key==='blank' || s.key==='scatterDollar' || s.key==='scatterStar') break;
      if(s.key==='wild'){ count++; cells.push([i,line[i]]); continue; }
      if(target===null){ target=s.key; count++; cells.push([i,line[i]]); continue; }
      if(s.key===target){ count++; cells.push([i,line[i]]); continue; }
      break;
    }
    if(target===null) target='wild';
    const t = PAY[target];
    if(t && t[count]){
      let w = b*t[count];
      const m = cells.reduce((s,[r,row])=>grid[r][row].key==='wild' ? s+grid[r][row].mult : s, 0);
      if(m>0) w *= m;
      w = R(w);
      total += w; wins.push(...cells);
      winLinesCells.push(cells);
    }
  });
  total = R(total);
  const dollarCells=[], starCells=[];
  grid.forEach((col,r)=>col.forEach((c,row)=>{
    if(c.key==='scatterDollar') dollarCells.push([r,row]);
    if(c.key==='scatterStar') starCells.push([r,row]);
  }));
  const sc = dollarCells.length + starCells.length;
  if(dollarCells.length>=3 && PAY.scatterDollar[Math.min(dollarCells.length,5)]){
    total = R(total + b*PAY.scatterDollar[Math.min(dollarCells.length,5)]);
    wins.push(...dollarCells);
    winLinesCells.push(dollarCells);
  }
  if(starCells.length>=3 && PAY.scatterStar[Math.min(starCells.length,5)]){
    total = R(total + b*PAY.scatterStar[Math.min(starCells.length,5)]);
    wins.push(...starCells);
    winLinesCells.push(starCells);
  }
  return {total, wins, sc, winLinesCells};
}

}

}

function showAuto(){
  const c=$('autoCnt');
  if(autoInfinite){ c.textContent='∞'; c.style.display='flex'; }
  else if(autoLeft>0){ c.textContent=autoLeft; c.style.display='flex'; }
  else { c.style.display='none'; }
  $('autoBtn').classList.toggle('on', autoInfinite || autoLeft>0);
}
function toggleAutoMenu(force){
  const m=$('autoMenu');
  const show = force!==undefined ? force : (m.style.display!=='flex');
  m.style.display = show ? 'flex' : 'none';
}
window.startAuto = () => {
  if(autoInfinite || autoLeft>0){ autoInfinite=false; autoLeft=0; showAuto(); toggleAutoMenu(false); return; }
  if(spinning || inFree) return;
  toggleAutoMenu();
};
window.chooseAuto = (n) => {
  toggleAutoMenu(false);
  if(spinning || inFree) return;
  if(n==='inf'){ autoInfinite=true; autoLeft=0; }
  else { autoInfinite=false; autoLeft=n; }
  showAuto();
  spin();
};
function autoNext(){
  if(!autoInfinite && autoLeft<=0) return;
  if(!autoInfinite){ autoLeft--; showAuto(); if(autoLeft<=0) return; }
  setTimeout(()=>{
    if(!autoInfinite && autoLeft<=0) return;
    if(!inFree && balance<bet){ autoInfinite=false; autoLeft=0; showAuto(); return; }
    spin();
  }, 600);
}
window.cycleSpeed = () => { speed=(speed+1)%3; $('speedBtn').textContent='⚡'.repeat(speed+1); };

window.toggleSound = () => {

  $('soundToggle').classList.toggle('off', !on);
};

  $('pkgCost3').textContent = R(bet*BONUS_COST_MULT['3']).toLocaleString()+' NSP';

  if(idx===-1) idx=0;
  idx = Math.max(0, Math.min(BETS.length-1, idx+dir));

window.confirmBuy = async () => {
  if(!pendingPkg) return;
  const cost = R(bet * BONUS_COST_MULT[pendingPkg]);
  if(balance < cost){
    $('result').innerHTML = `<span class="lose-t">رصيدك غير كافي (${cost.toLocaleString()})</span>`;
    closeBuyModal();
    return;
  }
  balance = R(balance - cost);
  guaranteedWildsPerSpin = pendingPkg==='1' ? 1 : pendingPkg==='2' ? 2 : pendingPkg==='3' ? 3 : (1+Math.floor(Math.random()*4));
  inFree=true; freeLeft=5; freeWin=0;
  closeBuyModal();
  showFreeSpinsIntro(5);
  update(); await save(); spin();
};

async function save(){
  if(!dbApi) return;
  try{ await dbApi.saveBalance(userId,{balance,totalSpins,totalWins}); }
  catch(e){ console.error('خطأ بالحفظ:', e); }
}

async function loadUser(){
  renderChips(); render(makeGrid()); update();
  try{
    try{ dbApi = await import('./db.js'); }
    catch(e){ throw new Error('فشل تحميل ملف db.js (تأكدي إنو جنب index.html): '+(e.message||e)); }
    let d;
    try{ d = await dbApi.loadBalance(userId, userName); }
    catch(e){ throw new Error('فشلت قراءة الرصيد من Firebase: '+(e.message||e)); }
    balance = R(d.balance); totalSpins = d.totalSpins; totalWins = R(d.totalWins);
    update();
  }catch(e){
    console.error(e);
    $('result').innerHTML = '<span class="lose-t">'+(e.message||e)+'</span>';
  }
}

window.spin = function(){
  if(spinning) return;
  if(!inFree && balance < bet){ $('result').innerHTML='<span class="lose-t">رصيدك غير كافي</span>'; return; }
  spinning = true;
  clearWinLines();
  document.querySelectorAll('.expand-wild').forEach(el=>el.remove());
  SoundEngine.unlock();
  SoundEngine.click();
  $('spinBtn').disabled = true; $('spinBtn').classList.add('spinning'); $('buyBtn').disabled = true;
  $('result').textContent = '';
  if(!inFree){ balance = R(balance - bet); totalSpins++; }
  update();

  const finalGrid = makeGrid();
  const sp = SPD[speed];
  const stopTicks = Array.from({length:REELS}, (_,r)=> sp[0] + r*STAGGER_TICKS);
  const tickCounters = new Array(REELS).fill(0);
  const stillSpinning = new Array(REELS).fill(true);
  for(let r=0;r<REELS;r++){ const rc=document.getElementById('reelCol'+r); if(rc) rc.classList.add('spinning'); }

  const iv = setInterval(()=>{
    let allStopped = true;
    for(let r=0;r<REELS;r++){
      if(!stillSpinning[r]) continue;
      allStopped = false;
      tickCounters[r]++;
      if(tickCounters[r] % 2 === 0) SoundEngine.reelTick();
      if(tickCounters[r] >= stopTicks[r]){
        stillSpinning[r] = false;
        SoundEngine.reelStop();
        const rc = document.getElementById('reelCol'+r);
        if(rc) rc.classList.remove('spinning');
        renderReelColumn(r, finalGrid[r], []);
      }else{
        renderReelColumn(r, randomColumn(poolForReel(r)), []);
      }
    }
    if(allStopped){ clearInterval(iv); resolveWithGrid(finalGrid); }
  }, sp[1]);
};

function spawnShockRing(){
  const ring = document.createElement('div');
  ring.className = 'shock-ring';
  document.body.appendChild(ring);
  setTimeout(()=> ring.remove(), 1050);
}
function showWinOverlay(amount, label){
  const ov = $('winOverlay');
  if(!ov) return;
  $('winOverlayTitle').textContent = label;
  $('winOverlayAmount').textContent = '0';
  ov.classList.add('show');
  const dur = 1900;
  const t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    $('winOverlayAmount').textContent = R(amount * eased).toLocaleString();
    if(p < 1) requestAnimationFrame(step);
    else setTimeout(()=> ov.classList.remove('show'), 900);
  }
  requestAnimationFrame(step);
}

async function resolveWithGrid(grid){
  const {total, wins, sc, winLinesCells} = evaluate(grid, bet);
  for(let r=0;r<REELS;r++){
    const winRows = wins.filter(([wr])=>wr===r).map(([,wrow])=>wrow);
    if(winRows.length) renderReelColumn(r, grid[r], winRows);
  }
  drawWinLines(winLinesCells);

  const wildReels = new Set();
  winLinesCells.forEach(cells=>{
    cells.forEach(([r,row])=>{ if(grid[r][row].key==='wild') wildReels.add(r); });
  });
  wildReels.forEach(r=>{
    const col = document.getElementById('reelCol'+r);
    if(!col) return;
    const glow = document.createElement('div');
    glow.className = 'wild-glow';
    col.appendChild(glow);
    const overlay = document.createElement('div');
    overlay.className = 'expand-wild';
    overlay.innerHTML = `<img src="${WILD_IMG[10]}" alt="" onerror="this.replaceWith(document.createTextNode('🌳'))">`;
    col.appendChild(overlay);
    spawnSparks(col, 10);
    setTimeout(()=>{ glow.remove(); }, 1400);
  });
  if(wildReels.size>0){
    SoundEngine.wildDrop();
    triggerGoldFlash();
    $('reels').classList.add('shake');
    setTimeout(()=> $('reels').classList.remove('shake'), 400);
  }

  let msg='';
  let bigOrMega = false;
  if(total>0){
    balance = R(balance + total); totalWins = R(totalWins + total); if(inFree) freeWin = R(freeWin + total);
    msg = `<span class="win-t">مكسب: ${total.toLocaleString()}</span>`;
    if(total >= bet*50){
      bigOrMega = true;
      SoundEngine.megaWin();
      showWinOverlay(total, 'MEGA WIN');
      spawnShockRing();
    } else if(total >= bet*20){
      bigOrMega = true;
      SoundEngine.bigWin();
      showWinOverlay(total, 'BIG WIN');
      spawnShockRing();
    } else if(total >= bet*5){
      SoundEngine.niceWin();
    } else {
      SoundEngine.win();
    }
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
  }
  $('result').innerHTML = msg;
  update();
  await save();

  const settleDelay = bigOrMega ? 3000 : (total>0 ? 900 : 0);
  setTimeout(()=>{
    spinning=false;
    $('spinBtn').classList.remove('spinning');
    $('buyBtn').disabled=false;
    if(inFree){
      freeLeft--;
      update();
      if(freeLeft<=0){
        inFree=false;
        guaranteedWildsPerSpin=0;
        $('result').innerHTML += (msg?'<br>':'') + `<span class="win-t">مجموع اللفات المجانية: ${freeWin.toLocaleString()}</span>`;
        update(); $('spinBtn').disabled=false; autoNext();
      } else { setTimeout(()=>spin(),1200); }
    } else { $('spinBtn').disabled=false; autoNext(); }
  }, settleDelay);
}

function preloadAll(){
  const urls=[...SYMS.filter(x=>x.img).map(x=>x.img),...Object.values(WILD_IMG),'images/spin-icon.jpg','images/bg.jpg'];
  return Promise.all(urls.map(u=>new Promise(res=>{
    const im=new Image(); const t=setTimeout(res,10000);
    im.onload=()=>{ clearTimeout(t); (im.decode?im.decode():Promise.resolve()).catch(()=>{}).then(res); };
    im.onerror=()=>{ clearTimeout(t); res(); };
    im.src=u;
  })));
}

if(!tg?.initDataUnsafe?.user){
  const addTestBonus = () => {
    balance = R(balance + 10000); update();
    $('result').innerHTML = '<span class="win-t">+10000 (اختبار)</span>';
  };
  const isTestKey = k => { k=(k||'').toLowerCase(); return k==='m' || k==='p' || k==='t'; };
  document.addEventListener('keydown', e=>{ if(isTestKey(e.key)) addTestBonus(); });
  window.addEventListener('keydown', e=>{ if(isTestKey(e.key)) addTestBonus(); });

  let tapCount=0, tapTimer=null;
  $('logoTitle').addEventListener('click', ()=>{
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer=setTimeout(()=>{ tapCount=0; },600);
    if(tapCount>=3){ tapCount=0; addTestBonus(); }
  });
}

function fitStage(){
  const stage = document.getElementById('stage');
  const cont = document.querySelector('.container');
  if(!stage || !cont) return;
  const cw = cont.offsetWidth, ch = cont.offsetHeight;
  if(!cw || !ch) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw/cw, vh/ch);
  stage.style.width = cw+'px';
  stage.style.height = ch+'px';
  stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
}
window.__fitStage = fitStage;
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitStage);

Promise.all([loadUser(), preloadAll()]).finally(()=>{ window.__dataReady=true; setTimeout(fitStage,0); requestAnimationFrame(fitStage); });
</script>
